name: Auto Publisher - Weekly Blog Posts

# 触发条件：
# 1. 定时触发：每周二、四、六 北京时间10:00（UTC 02:00）
# 2. 手动触发：可以在GitHub Actions页面手动运行
on:
  schedule:
    # cron格式：分 时 日 月 周
    # 每周二(2)、四(4)、六(6) UTC 02:00 = 北京时间10:00
    - cron: '0 2 * * 2,4,6'
  workflow_dispatch:
    # 手动触发

# 权限配置：允许写入仓库内容
permissions:
  contents: write
  actions: read

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
      
      - name: Run auto publisher
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始运行自动发文系统..."
          cd tools/auto-publisher
          python run.py
          
          # 读取最新的结果文件
          LATEST_RESULT=$(ls -t logs/result_*.json | head -1)
          echo "结果文件: $LATEST_RESULT"
          
          # 提取关键信息
          if [ -f "$LATEST_RESULT" ]; then
            STATUS=$(python -c "import json; data=json.load(open('$LATEST_RESULT')); print(data.get('status', 'unknown'))")
            KEYWORD=$(python -c "import json; data=json.load(open('$LATEST_RESULT')); print(data.get('keyword', 'N/A'))")
            COMMIT=$(python -c "import json; data=json.load(open('$LATEST_RESULT')); print(data.get('commit_sha', 'N/A'))")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "keyword=$KEYWORD" >> $GITHUB_OUTPUT
            echo "commit=$COMMIT" >> $GITHUB_OUTPUT
            echo "运行状态: $STATUS"
            echo "发布关键词: $KEYWORD"
            echo "Commit: $COMMIT"
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-publisher-logs
          path: tools/auto-publisher/logs/
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          echo "## 自动发文系统运行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **运行状态**: ${{ steps.publish.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **发布关键词**: ${{ steps.publish.outputs.keyword }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.publish.outputs.commit }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 文章链接" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish.outputs.status }}" = "success" ]; then
            SLUG=$(echo "${{ steps.publish.outputs.keyword }}" | tr ' ' '-')
            echo "- 英文: https://zhongsai-steelstructure.com/en/blog/$SLUG/" >> $GITHUB_STEP_SUMMARY
            echo "- 中文: https://zhongsai-steelstructure.com/zh/blog/$SLUG/" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 说明" >> $GITHUB_STEP_SUMMARY
          echo "- 文章通过GitHub API自动发布，触发Cloudflare Pages自动部署" >> $GITHUB_STEP_SUMMARY
          echo "- 部署完成后即可在正式网站访问" >> $GITHUB_STEP_SUMMARY
