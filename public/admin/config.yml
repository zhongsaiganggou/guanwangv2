backend:
  name: github
  repo: zhongsaiganggou/guanwangv2
  branch: main
  base_url: https://zhongsai-steelstructure.com
  auth_endpoint: /api/cms-auth

site_url: https://zhongsai-steelstructure.com
display_url: https://zhongsai-steelstructure.com
logo_url: /images/logo.png

media_folder: "public/images/blog"
public_folder: "/images/blog"

publish_mode: editorial_workflow

collections:
  - name: "blog-en"
    label: "Blog (English)"
    folder: "src/content/blog/en"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{category}} — {{status}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Language", name: "language", widget: "hidden", default: "en" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, hint: "If empty: Title | ZhongSai Steel Structure. Avoid keyword stuffing." }
      - { label: "Meta Description", name: "metaDescription", widget: "text", required: false, hint: "Recommended 120-160 characters." }
      - { label: "H1", name: "h1", widget: "string", required: false, hint: "If empty, H1 = Title. Only one H1 per page." }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Cost & Planning", value: "Cost & Planning" }
          - { label: "Import & Shipping", value: "Import & Shipping" }
          - { label: "Manufacturing & Quality", value: "Manufacturing & Quality" }
          - { label: "Installation & Technical", value: "Installation & Technical" }
          - { label: "Supplier Selection", value: "Supplier Selection" }
          - { label: "Materials & Components", value: "Materials & Components" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Cover Image Alt", name: "coverImageAlt", widget: "string", required: false, hint: "Describe the image, don't keyword stuff." }
      - { label: "Author", name: "author", widget: "hidden", default: "ZhongSai Steel Structure Editorial Team" }
      - { label: "Published Date", name: "publishedAt", widget: "datetime", required: false, format: "YYYY-MM-DD" }
      - { label: "Updated Date", name: "updatedAt", widget: "datetime", required: false, format: "YYYY-MM-DD" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Draft", value: "draft" }
          - { label: "Published", value: "published" }
        default: "draft"
      - { label: "Translation Key", name: "translationKey", widget: "string", required: false, hint: "Same key for EN/ZH pair to establish language relation." }
      - { label: "Alternate Slug (ZH)", name: "alternateSlug", widget: "string", required: false }
      - label: "Related Products"
        name: "relatedProducts"
        widget: "list"
        required: false
        fields: [{ label: "Product", name: "product", widget: "string" }]
      - label: "Related Components"
        name: "relatedComponents"
        widget: "list"
        required: false
        fields: [{ label: "Component", name: "component", widget: "string" }]
      - label: "CTA Type"
        name: "ctaType"
        widget: "select"
        options:
          - { label: "Send Drawings", value: "send-drawings" }
          - { label: "Send Project Requirements", value: "send-project-requirements" }
          - { label: "Discuss Your Project", value: "discuss-project" }
          - { label: "View Manufacturing", value: "view-manufacturing" }
          - { label: "View Export Process", value: "view-export-process" }
          - { label: "View Components", value: "view-components" }
          - { label: "No CTA", value: "none" }
        default: "send-project-requirements"
      - { label: "CTA Text", name: "ctaText", widget: "string", required: false }
      - { label: "No Index", name: "noindex", widget: "boolean", default: false, hint: "Check for test or draft pages that should not be indexed." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog-zh"
    label: "Blog (中文)"
    folder: "src/content/blog/zh"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{category}} — {{status}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "语言", name: "language", widget: "hidden", default: "zh" }
      - { label: "SEO标题", name: "seoTitle", widget: "string", required: false, hint: "留空则使用：标题 | 中赛钢结构。避免关键词堆砌。" }
      - { label: "Meta描述", name: "metaDescription", widget: "text", required: false, hint: "建议120-160字符。" }
      - { label: "H1标题", name: "h1", widget: "string", required: false, hint: "留空则H1=标题。每页只能有一个主H1。" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - label: "分类"
        name: "category"
        widget: "select"
        options:
          - { label: "成本与规划", value: "Cost & Planning" }
          - { label: "进口与运输", value: "Import & Shipping" }
          - { label: "制造与质量", value: "Manufacturing & Quality" }
          - { label: "安装与技术", value: "Installation & Technical" }
          - { label: "供应商选择", value: "Supplier Selection" }
          - { label: "材料与构件", value: "Materials & Components" }
      - { label: "封面图片", name: "coverImage", widget: "image", required: false }
      - { label: "封面图片Alt", name: "coverImageAlt", widget: "string", required: false, hint: "描述图片内容，不要关键词堆砌。" }
      - { label: "作者", name: "author", widget: "hidden", default: "ZhongSai Steel Structure Editorial Team" }
      - { label: "发布日期", name: "publishedAt", widget: "datetime", required: false, format: "YYYY-MM-DD" }
      - { label: "更新日期", name: "updatedAt", widget: "datetime", required: false, format: "YYYY-MM-DD" }
      - label: "状态"
        name: "status"
        widget: "select"
        options:
          - { label: "草稿", value: "draft" }
          - { label: "已发布", value: "published" }
        default: "draft"
      - { label: "翻译关联Key", name: "translationKey", widget: "string", required: false, hint: "中英文对应文章使用相同Key建立语言关联。" }
      - { label: "对应英文Slug", name: "alternateSlug", widget: "string", required: false }
      - label: "相关产品"
        name: "relatedProducts"
        widget: "list"
        required: false
        fields: [{ label: "产品", name: "product", widget: "string" }]
      - label: "相关构件"
        name: "relatedComponents"
        widget: "list"
        required: false
        fields: [{ label: "构件", name: "component", widget: "string" }]
      - label: "CTA类型"
        name: "ctaType"
        widget: "select"
        options:
          - { label: "发送图纸", value: "send-drawings" }
          - { label: "提交项目需求", value: "send-project-requirements" }
          - { label: "沟通项目需求", value: "discuss-project" }
          - { label: "查看制造流程", value: "view-manufacturing" }
          - { label: "查看出口流程", value: "view-export-process" }
          - { label: "查看构件", value: "view-components" }
          - { label: "无CTA", value: "none" }
        default: "send-project-requirements"
      - { label: "CTA文字", name: "ctaText", widget: "string", required: false }
      - { label: "不被索引", name: "noindex", widget: "boolean", default: false, hint: "测试页或草稿页勾选，不被Google索引。" }
      - { label: "正文", name: "body", widget: "markdown" }
