name = "zhongsai-website-v2"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# ============================================================
# Cloudflare Resource Bindings (TO BE CONFIGURED IN DASHBOARD)
# ============================================================
# The following bindings must be configured in Cloudflare Pages
# dashboard under Settings > Functions > Bindings.
# Do NOT uncomment below until resources are created and IDs are known.
#
# D1 Database for lead persistence:
#   Binding name: LEADS_DB
#   Database name: zhongsai-leads
#   Create: wrangler d1 create zhongsai-leads
#   Run migration: wrangler d1 execute zhongsai-leads --file=./migrations/0001_create_leads.sql
#
# R2 Bucket for uploaded drawing files:
#   Binding name: LEAD_FILES
#   Bucket name: zhongsai-lead-files
#   Create: wrangler r2 bucket create zhongsai-lead-files
#
# Environment variables (set in dashboard Settings > Environment variables):
#   TURNSTILE_SECRET_KEY  - Cloudflare Turnstile secret key
#   PUBLIC_TURNSTILE_SITE_KEY - Cloudflare Turnstile site key (public)
#   PUBLIC_GA_MEASUREMENT_ID - Google Analytics 4 measurement ID (public)
#   LEAD_WEBHOOK_URL - (optional) CRM webhook URL
#   LEAD_WEBHOOK_SECRET - (optional) webhook signing secret
# ============================================================

[[d1_databases]]
binding = "LEADS_DB"
database_name = "zhongsai-leads"
database_id = "fadaebf1-1310-4512-9e8c-1cd415cf34eb"
migrations_dir = "migrations"

# R2 binding for uploaded drawing files:
[[r2_buckets]]
binding = "LEAD_FILES"
bucket_name = "zhongsai-lead-files"

# ============================================================
# PREVIEW ENVIRONMENT (separate D1 / R2 / env vars)
# ============================================================
# In Cloudflare Pages Dashboard → Settings → Functions → Bindings:
#   Preview environment must point to:
#     D1: zhongsai-leads-preview   (separate database_id)
#     R2: zhongsai-lead-files-preview
#
#   Preview environment variables (set ONLY in Preview environment):
#     PREVIEW_MODE = "true"          (backend: forces isTest=1, skips webhook/wecom/CAPI)
#     PUBLIC_IS_PREVIEW = "true"     (frontend: no GA4/Meta Pixel scripts at all)
#
#   These variables must NOT exist in Production:
#     PREVIEW_MODE
#     PUBLIC_IS_PREVIEW
#
#   Even if LEAD_WEBHOOK_URL / WECHAT_WORK_WEBHOOK_URL / FB_CAPI_ACCESS_TOKEN
#   are accidentally set in Preview, the backend checks !isPreviewEnv first
#   and skips them. This is defense-in-depth.
#
# The blocks below are documentation; actual bindings are configured
# in the Cloudflare Pages dashboard, not here.

[env.preview]
name = "zhongsai-website-v2-preview"

[env.preview.vars]
PREVIEW_MODE = "true"
PUBLIC_IS_PREVIEW = "true"

[[env.preview.d1_databases]]
binding = "LEADS_DB"
database_name = "zhongsai-leads-preview"
database_id = "631b29f3-1bf3-47fa-9573-2a6e29ad75e1"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "LEAD_FILES"
bucket_name = "zhongsai-lead-files-preview"
